name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: which xcodegen || brew install xcodegen

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test-unit

      - name: UI tests
        run: make test-ui

      - name: Upload UI test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: .build/DerivedData/Logs/Test/*.xcresult
          retention-days: 7
