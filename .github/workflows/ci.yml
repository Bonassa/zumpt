name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install XcodeGen
        run: which xcodegen || brew install xcodegen

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test-unit

      # The hosted runner's screen is 1024x768, narrower than the app's minimum window.
      - name: Enlarge the display
        run: |
          defaults write com.apple.dock autohide -bool true && killall Dock || true
          brew install displayplacer || true
          displayplacer list || true
          id=$(displayplacer list | awk '/^Persistent screen id:/ {print $4; exit}')
          res=$(displayplacer list | grep -oE 'res:[0-9]+x[0-9]+' | sed 's/res://' | sort -t x -k1,1n -k2,2n | tail -1)
          echo "Largest mode: $res on screen $id"
          if [ -n "$id" ] && [ -n "$res" ]; then displayplacer "id:$id res:$res scaling:off origin:(0,0) degree:0" || true; fi
          sleep 2
          osascript -l JavaScript -e 'ObjC.import("AppKit"); $.NSScreen.screens.js.map(s => JSON.stringify({frame: s.frame, visible: s.visibleFrame})).join("\n")' || true

      - name: UI tests
        run: make test-ui

      - name: Show UI test failures
        if: failure()
        shell: bash
        run: |
          for bundle in .build/DerivedData/Logs/Test/*.xcresult; do
            xcrun xcresulttool get test-results summary --path "$bundle" --format json > summary.json
            python3 - <<'PY'
          import json
          for failure in json.load(open("summary.json")).get("testFailures", []):
              name = failure.get("testIdentifierString", "?")
              text = failure.get("failureText", "").replace("\n", " ")
              print("::error title=" + name + "::" + text)
          PY
          done

      - name: Upload UI test results
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: ui-test-results
          path: .build/DerivedData/Logs/Test/*.xcresult
          retention-days: 7
